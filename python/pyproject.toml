[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sphinx-quantum-solver"
version = "0.1.0"
description = "Python implementation of the SPHINX Schrodinger-Maxwell solver"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "scipy>=1.13"]

[project.optional-dependencies]
plots = ["matplotlib>=3.8", "imageio-ffmpeg>=0.5"]

[project.scripts]
sphinx-demo = "sphinx_solver.demo:main"

[tool.setuptools.packages.find]
where = ["src"]
